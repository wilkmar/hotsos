checks:
  is_compute_host_using_masakari:
    apt: [nova-compute, masakari-host-monitor]
  pr_installed:
    apt: pacemaker-remote
  pr_enabled:
    or:
      systemd:
        pacemaker_remote: enabled
      pebble:
        pacemaker_remote: active
conclusions:
  pacemaker_not_installed:
    priority: 2
    decision:
      - is_compute_host_using_masakari
      - not: pr_installed
    raises:
      type: OpenstackWarning
      message: >-
        This node is running OpenStack nova-compute and Masakari but the
        required pacemaker-remote package is not installed, so Masakari host
        monitoring cannot function. Install and enable pacemaker-remote on this
        node.
  pacemaker_not_enabled:
    priority: 1
    decision:
      and: [is_compute_host_using_masakari, pr_installed]
      not: pr_enabled
    raises:
      type: OpenstackWarning
      message: >-
        This node is running OpenStack nova-compute and Masakari but the
        required pacemaker_remote.service is not enabled, so Masakari host
        monitoring cannot function. Enable and start pacemaker_remote.service on
        this node.
