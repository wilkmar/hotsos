    input:
      path: 'var/log/neutron/neutron-ovn-metadata-agent.log'
    expr: '([\d-]+) [\d:]+\.\d{3} .+AttributeError: ''MetadataProxyHandler'' object has no attribute ''sb_idl'''
conclusions:
  lp1928031:
