checks:
  has_1965297:
    input:
      path: 'var/log/neutron/neutron-l3-agent.log'
    expr: '([\d-]+) [\d:]+\.\d{3} .+Gateway interface for router \S+ was not set up; router will not work properly'
conclusions:
  lp1965297:
    decision: has_1965297
    raises:
      type: LaunchpadBug
      bug-id: 1965297
      message: >-
        The neutron l3-agent on this host is affected by known bug LP1965297,
        which impacts HA routers and can cause router updates to stall. Upgrade
        neutron to the latest version; see the bug for details.
