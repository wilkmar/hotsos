checks:
  has_2017748:
    input:
      path: 'var/log/neutron/neutron-ovn-metadata-agent.log'
    search:
      expr: '([\d-]+ [\d:]+.\d{3}) .+neutron.agent.ovn.metadata.agent \[-\] There is no metadata port for network \S+ or it has no MAC or IP addresses configured, tearing the namespace down if needed'
      constraints:
        min-results: 1
        search-period-hours: 24
        search-result-age-hours: 48
conclusions:
  lp2017748:
    decision:
      - has_2017748
    raises:
      type: LaunchpadBug
      bug-id: 2017748
      message: >-
        neutron-ovn-metadata-agent on this host is affected by known bug
        LP2017748, which can leave a network without a metadata port and tear
        down its metadata namespace. Upgrade neutron to the latest version; see
        the bug for details.
