checks:
  has_1944619:
    input:
      path: 'var/log/nova/nova-compute.log'
    expr: '([\d-]+) [\d:]+\.\d{3} .+attaching network adapter failed.: libvirt.libvirtError: Requested operation is not valid: PCI device'
    hint: 'libvirtError'
conclusions:
  lp1944619:
    decision: has_1944619
    raises:
      type: LaunchpadBug
      bug-id: 1944619
      message: >-
        This host is affected by Nova bug LP1944619: after a failed live
        migration of an instance with a hardware-offloaded OVS port, the PCI
        device is left in use by QEMU and the instance loses network
        connectivity. Upgrade Nova to the latest version and see the bug
        report for details.
