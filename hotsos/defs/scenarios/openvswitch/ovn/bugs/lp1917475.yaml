checks:
  has_1917475:
    input: 'openvswitch:ovn/ovn-controller.log'
    search:
      expr: '([\d-]+)T([\d:]+)\.\d+Z.+transaction error: {"details":"RBAC rules for client \\"\S+\\" role \\"\S+\\" prohibit .+ table\s+\\"\S+\\".","error":"permission error"'
      constraints:
        search-result-age-hours: 24
conclusions:
  lp1917475:
    decision: has_1917475
    raises:
      type: LaunchpadBug
      bug-id: 1917475
      message: >-
        ovn-controller on this host is hitting known bug LP1917475, which causes
        OVN database RBAC permission errors on transactions. Upgrade OVN to the
        latest version; see the bug for details.
